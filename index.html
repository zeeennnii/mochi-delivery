
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mochi Delivery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top, #fff0fa, transparent 55%),
                #fff8fc;
            font-family: Georgia, serif;
            color: #704b83;
        }

        .page {
            width: 100%;
            max-width: 650px;
            margin: auto;
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            color: #9259a8;
            font-size: clamp(30px, 6vw, 42px);
            text-shadow: 2px 3px 0 #f4d9ee;
            letter-spacing: 1.5px;
        }

        .subtitle {
            margin: 0 0 22px;
            color: #896c91;
            font-size: 15px;
        }

        .panel {
            width: 100%;
            background: #fffdfb;
            border: 3px solid #eddaef;
            border-radius: 27px;
            padding: 17px;
            box-shadow:
                0 12px 30px rgba(133, 81, 160, 0.13),
                inset 0 0 15px rgba(255, 231, 247, 0.5);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat {
            padding: 10px 5px;
            background: linear-gradient(135deg, #fff0f8, #f2e8ff);
            border: 2px solid #f0dff4;
            border-radius: 15px;
            color: #704b83;
            font-size: 14px;
            font-weight: bold;
        }

        .game-area {
            position: relative;
            width: 100%;
            max-width: 530px;
            margin: 0 auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border: 3px solid #efd9e9;
            border-radius: 19px;
            box-shadow: 0 5px 14px rgba(125, 83, 139, 0.10);
            background: #fff4e6;
        }

        .message {
            min-height: 25px;
            margin: 12px 0 5px;
            color: #9259a8;
            font-weight: bold;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        button {
            border: none;
            padding: 10px 20px;
            color: white;
            font-family: inherit;
            font-weight: bold;
            font-size: 14px;
            background: linear-gradient(135deg, #bb83d0, #9160ad);
            border-radius: 15px;
            box-shadow: 0 4px 0 #754b91;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: linear-gradient(135deg, #d09ce0, #a875c1);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #754b91;
        }

        .mobile-controls {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 14px;
        }

        .mobile-controls button {
            width: 55px;
            height: 45px;
            padding: 5px;
            font-size: 20px;
            border-radius: 14px;
            touch-action: none;
        }

        .instructions {
            margin: 18px 0 3px;
            color: #896c91;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 10px;
            }

            .panel {
                padding: 11px;
                border-radius: 20px;
            }

            .stat {
                font-size: 12px;
            }

            .subtitle {
                font-size: 13px;
            }
        }
    </style>

    <script src="script.js" defer></script>
</head>

<body>

    <main class="page">

        <h1>🍡 Mochi Delivery</h1>

        <p class="subtitle">
            Catch the mochi. Dodge the puddles. Make every delivery count!
        </p>

        <section class="panel">

            <div class="stats">

                <div class="stat">
                    Score: <span id="score">0</span>
                </div>

                <div class="stat">
                    Lives: <span id="lives">3</span> ❤️
                </div>

                <div class="stat">
                    Time: <span id="timer">45</span>s
                </div>

            </div>

            <div class="game-area">
                <canvas id="gameCanvas" width="530" height="400"></canvas>
            </div>

            <div class="message" id="message">
                Press Start Game to begin!
            </div>

            <div class="buttons">
                <button id="startBtn">Start Game</button>
                <button id="restartBtn">Restart</button>
            </div>

            <div class="mobile-controls">
                <button id="leftBtn" aria-label="Move left">◀</button>
                <button id="rightBtn" aria-label="Move right">▶</button>
            </div>

            <p class="instructions">
                Controls: ← → arrow keys or A / D.<br>
                On mobile, use the buttons above.<br>
                Catch 🍡, avoid 💧, and collect 💖 power-ups!
            </p>

        </section>

    </main>

</body>
</html>
